<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>墨城贪吃蛇 · Mobile Pro</title>
  <style>
    :root{
      --bg:#0B1020; --ink:#EAF3FF; --mut:#9CA3AF; --ring:#2B3257;
      --pri:#00C2A8; --acc:#7C3AED; --gold:#FFD76A;
      --pad: max(16px, env(safe-area-inset-left));
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui;
      -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; overscroll-behavior: none;
    }
    .wrap{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px var(--pad) max(12px,env(safe-area-inset-bottom))}
    .bar{display:flex;align-items:center;gap:12px}
    .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
      background:conic-gradient(from 180deg,var(--pri),#47E5D2,var(--pri));font-weight:900;color:#062e27;box-shadow:0 6px 18px rgba(0,194,168,.35)}
    .title{font-weight:900}
    .sub{font-size:12px;color:var(--mut)}
    .chip{margin-left:auto;border:1px solid var(--ring);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.02)}
    .board{position:relative;border:1px solid var(--ring);border-radius:16px;background:linear-gradient(180deg,#0F1430,#0B1026);overflow:hidden}
    #c{display:block;width:100%;height:auto;border-radius:12px}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .btn{min-width:96px;background:linear-gradient(180deg,#14D4BE,#00C2A8);color:#00100C;border:none;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,194,168,.25)}
    .btn-ghost{min-width:92px;background:transparent;border:1px solid #3A416D;color:#CFE;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
    .hint{font-size:12px;color:var(--mut);text-align:center}
    /* 移动端触控区（自动在移动端显示） */
    .touch{
      display:grid;grid-template:repeat(3,64px)/repeat(3,64px);
      gap:10px;place-content:center;margin:10px auto 0;
      user-select:none;touch-action:none;
    }
    @media (min-width: 820px){ .touch{display:none} } /* 桌面隐藏触控区 */

    .key{border:1px solid #3A416D;border-radius:14px;display:grid;place-items:center;color:#CFE;background:rgba(255,255,255,.02)}
    .key.active{outline:2px solid var(--pri)}

    .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,6,18,.52);backdrop-filter:blur(6px);z-index:20}
    .modal.show{display:grid}
    .card{width:min(92vw,520px);background:linear-gradient(180deg,#0E1330,#0A0F25);border:1px solid #2E3664;border-radius:18px;padding:18px 18px 14px}
    .ttl{font-size:22px;font-weight:900;margin:0 0 8px;background:linear-gradient(90deg,#B48CFF,#5CF0E1,#B48CFF);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="logo">MM</div>
      <div><div class="title">墨城贪吃蛇 · Mobile Pro</div><div class="sub">移动端高适配 · 更顺滑更清晰</div></div>
      <div class="chip" id="scoreChip">得分：0</div>
    </div>

    <!-- 自适应画布容器：高度 = 视窗短边的 ~ 70% -->
    <div class="board" id="board">
      <canvas id="c" width="600" height="600" aria-label="贪吃蛇"></canvas>
    </div>

    <div class="row">
      <button class="btn" id="btnStart">开始/暂停</button>
      <button class="btn-ghost" id="btnRestart">重开</button>
      <button class="btn-ghost" id="btnSlow">减速</button>
      <button class="btn-ghost" id="btnFast">加速</button>
      <button class="btn-ghost" id="btnShare">分享邀请</button>
    </div>

    <div class="touch" id="touch">
      <div></div><div class="key" data-k="Up">↑</div><div></div>
      <div class="key" data-k="Left">←</div><div class="key" data-k="Pause">●</div><div class="key" data-k="Right">→</div>
      <div></div><div class="key" data-k="Down">↓</div><div></div>
    </div>

    <div class="hint">手机推荐竖屏；如需横屏，请旋转设备。避免浏览器手势干扰，已关闭页面滚动。</div>
  </div>

  <!-- Game Over -->
  <div class="modal" id="over">
    <div class="card">
      <div class="ttl">💥 本局结束</div>
      <div id="overText" style="color:#C8D1FF;margin-bottom:10px">得分 0 · 最长 3 节</div>
      <div class="actions">
        <button class="btn-ghost" onclick="location.reload()">再来一局</button>
        <button class="btn" id="btnClaim">去领奖中心</button>
      </div>
    </div>
  </div>

<script>
/* ============ 配置（可接你的后端） ============ */
const CONFIG = {
  GRID: 20,                // 基础网格像素（逻辑单位，实际会乘 DPR）
  BASE_SPEED: 7.2,         // 越大越快（帧推进速度）
  SPEED_MIN: 4.0,
  SPEED_MAX: 12.0,
  CLAIM_URL: "#",          // 领奖中心
  SHARE_TITLE: "来挑战更丝滑的墨城贪吃蛇！",
  SHARE_TEXT: "高分屏清晰、触控顺滑、达标可领酒水券～"
};

/* ============ 适配：DPR & 自适应画布 ============ */
const board = document.getElementById('board');
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false, desynchronized: true });
let DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
let vw = 0, vh = 0, viewSize = 0;

function resizeCanvas(){
  // 目标：正方形画布占短边的 ~70%，上面留标题，下面留按键
  vw = window.innerWidth; vh = window.innerHeight;
  const short = Math.min(vw, vh);
  const targetCss = Math.max(300, Math.floor(short * 0.72)); // CSS 像素
  // 物理像素 = CSS * DPR
  const px = Math.floor(targetCss * DPR);

  cvs.style.width = cvs.style.height = targetCss + 'px';
  cvs.width = cvs.height = px;
  viewSize = px; // 逻辑渲染区域（带 DPR）
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', ()=>{ DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1)); resizeCanvas(); draw(); }, { passive:true });

/* ============ 游戏状态 ============ */
const scoreChip = document.getElementById('scoreChip');
const overModal = document.getElementById('over');
const overText = document.getElementById('overText');
const btnClaim = document.getElementById('btnClaim');

let running = false;
let dir = 'Right', nextDir = 'Right';
let snake = [], food = null, score = 0, best = +(localStorage.getItem('snake_best')||0);

let grid = CONFIG.GRID;         // 逻辑单位（未乘 DPR）
let stepSpeed = CONFIG.BASE_SPEED;
let acc = 0;                    // 帧累积器（驱动固定逻辑步长）
function gridCount(){ return Math.floor(viewSize / (grid * DPR)); } // 每边格子数

/* ============ 工具 & 绘制 ============ */
function rnd(n){ return Math.floor(Math.random()*n); }
function drawCell(x,y,color){
  const s = grid * DPR;
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x*s), Math.round(y*s), Math.ceil(s-1*DPR), Math.ceil(s-1*DPR));
}
function placeFood(){
  const N = gridCount();
  while(true){
    const f = { x:rnd(N), y:rnd(N) };
    if(!snake.some(s=>s.x===f.x && s.y===f.y)){ food = f; return; }
  }
}
function reset(){
  stepSpeed = CONFIG.BASE_SPEED;
  dir = nextDir = 'Right';
  snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  score = 0; setScore(0);
  placeFood();
  draw();
}
function setScore(n){
  score = n; scoreChip.textContent = `得分：${n}`;
  if(n>best){ best=n; localStorage.setItem('snake_best', best); }
}
function draw(){
  const N = gridCount();
  ctx.fillStyle = '#0A0F25'; ctx.fillRect(0,0,viewSize,viewSize);

  // 网格微光
  ctx.strokeStyle = 'rgba(44,51,95,.22)'; ctx.lineWidth = 1;
  const s = grid * DPR;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const p = Math.round(i*s);
    ctx.moveTo(p,0); ctx.lineTo(p,viewSize);
    ctx.moveTo(0,p); ctx.lineTo(viewSize,p);
  }
  ctx.stroke();

  if(food){ drawCell(food.x, food.y, '#FFD76A'); }
  snake.forEach((seg,i)=> drawCell(seg.x, seg.y, i===0 ? '#00C2A8' : '#7C3AED'));
}

/* ============ 主循环（rAF + 固定逻辑步长） ============ */
let last = 0;
function tick(ts){
  if(!running){ last = ts; return requestAnimationFrame(tick); }
  const dt = Math.min(33, ts - last); last = ts;
  acc += dt * 0.06 * stepSpeed;   // 帧率自适配推进

  while(acc >= 1){
    step(); acc -= 1;
  }
  draw();
  requestAnimationFrame(tick);
}
function step(){
  dir = nextDir;
  const head = { ...snake[0] };
  if(dir==='Up') head.y -= 1;
  if(dir==='Down') head.y += 1;
  if(dir==='Left') head.x -= 1;
  if(dir==='Right') head.x += 1;

  const N = gridCount();
  if(head.x<0 || head.y<0 || head.x>=N || head.y>=N) return gameOver();
  if(snake.some(s=>s.x===head.x && s.y===head.y)) return gameOver();

  snake.unshift(head);

  if(food && head.x===food.x && head.y===food.y){
    setScore(score+10);
    placeFood();
    stepSpeed = Math.min(CONFIG.SPEED_MAX, stepSpeed + 0.2);
  }else{
    snake.pop();
  }
}

/* ============ 交互：按钮 / 键盘 / 触控 ============ */
function playPause(){ running = !running; }
function setDir(newDir){
  const opp = {Up:'Down', Down:'Up', Left:'Right', Right:'Left'};
  if(opp[dir]===newDir) return;
  nextDir = newDir;
}

document.getElementById('btnStart').addEventListener('click', playPause);
document.getElementById('btnRestart').addEventListener('click', ()=>{ running=false; reset(); draw(); });
document.getElementById('btnFast').addEventListener('click', ()=> stepSpeed = Math.min(CONFIG.SPEED_MAX, stepSpeed+0.6));
document.getElementById('btnSlow').addEventListener('click', ()=> stepSpeed = Math.max(CONFIG.SPEED_MIN, stepSpeed-0.6));
document.getElementById('btnShare').addEventListener('click', async ()=>{
  const base = location.origin + location.pathname.replace(/\/$/,'');
  const link = `${base}?ref=${encodeURIComponent(getInviterId())}`;
  if(navigator.share){ try{ await navigator.share({ title: CONFIG.SHARE_TITLE, text: CONFIG.SHARE_TEXT, url: link }); }catch(e){} }
  else { await navigator.clipboard.writeText(link).catch(()=>{}); alert('邀请链接已复制：\n'+link); }
});

document.addEventListener('keydown', (e)=>{
  const k = e.key;
  if(k==='ArrowUp' || k==='w') setDir('Up');
  if(k==='ArrowDown'|| k==='s') setDir('Down');
  if(k==='ArrowLeft'|| k==='a') setDir('Left');
  if(k==='ArrowRight'|| k==='d') setDir('Right');
  if(k===' '||k==='Enter') playPause();
});

/* 触控：按钮 + 滑动手势（Pointer Events） */
const touch = document.getElementById('touch');
touch.addEventListener('pointerdown', e=>{
  const b = e.target.closest('.key'); if(!b) return;
  b.classList.add('active');
  const k = b.dataset.k;
  if(k==='Pause') return playPause();
  setDir(k);
});
touch.addEventListener('pointerup', e=>{
  const b = e.target.closest('.key'); if(b) b.classList.remove('active');
});
let swipeStart = null;
cvs.addEventListener('pointerdown', e=>{ swipeStart = {x:e.clientX,y:e.clientY}; });
cvs.addEventListener('pointermove', e=>{
  if(!swipeStart) return;
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
  if(Math.abs(dx)+Math.abs(dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)){ setDir(dx>0?'Right':'Left'); } else { setDir(dy>0?'Down':'Up'); }
  swipeStart = null;
});
cvs.addEventListener('pointerup', ()=> swipeStart=null);
cvs.addEventListener('touchmove', e=> e.preventDefault(), { passive:false }); // 阻止滚动

/* ============ 结束/领奖 & 邀请ID ============ */
function gameOver(){
  running=false;
  overText.textContent = `得分 ${score} · 历史最佳 ${best}`;
  document.getElementById('over').classList.add('show');
}
btnClaim.addEventListener('click', ()=> location.href = CONFIG.CLAIM_URL || '#');

function getInviterId(){
  let id = localStorage.getItem('inviter_id');
  if(!id){ id = 'U' + Math.random().toString(36).slice(2,8); localStorage.setItem('inviter_id', id); }
  return id;
}

/* ============ 启动 ============ */
resizeCanvas(); reset(); draw(); requestAnimationFrame(tick);
</script>
</body>
</html>
