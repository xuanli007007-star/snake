<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨城贪吃蛇 · 360° Wrap</title>
<style>
  :root{--bg:#040713;--ink:#EAF3FF;--mut:#9AA4B2;--ring:#2B3257;--pri:#00C2A8;--acc:#7C3AED;--gold:#FFD76A;--aurora:#4FD1C5}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:#030512;color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
       touch-action:manipulation;overscroll-behavior:none;position:relative;min-height:100%}
  body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2}
  body::before{background:
      radial-gradient(1px 1px at 20% 10%,rgba(255,255,255,.5),transparent 55%),
      radial-gradient(1px 1px at 80% 30%,rgba(124,58,237,.6),transparent 60%),
      radial-gradient(1px 1px at 35% 70%,rgba(79,209,197,.6),transparent 60%),
      radial-gradient(1px 1px at 60% 55%,rgba(255,215,106,.8),transparent 65%),
      radial-gradient(1300px 900px at 50% -20%,#0E1430 10%,#040713 60%);
      background-size:cover;opacity:.92;filter:drop-shadow(0 0 12px rgba(12,22,52,.4))}
  body::after{background:conic-gradient(from 90deg at 50% 20%,rgba(79,209,197,.22),rgba(124,58,237,.05),rgba(18,26,60,.35),rgba(79,209,197,.22));
               animation:aurora 28s ease-in-out infinite;mix-blend-mode:screen;z-index:-1;opacity:.45}
  @keyframes aurora{0%{transform:translate3d(-6%,0,0) rotate(-2deg)}50%{transform:translate3d(6%,2%,0) rotate(1deg)}100%{transform:translate3d(-6%,0,0) rotate(-2deg)}}
  .wrap{height:100%;display:flex;flex-direction:column;gap:16px;padding:18px max(18px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-bottom));position:relative;z-index:1}
  .bar{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:18px;background:rgba(10,16,38,.42);
       border:1px solid rgba(88,112,178,.32);backdrop-filter:blur(12px);box-shadow:0 18px 45px rgba(6,15,35,.55)}
  .logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
        background:conic-gradient(from 180deg,var(--pri),#47E5D2,var(--pri));font-weight:900;color:#062e27;box-shadow:0 14px 32px rgba(0,194,168,.35);
        position:relative;overflow:hidden}
  .logo::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 20% 20%,rgba(255,255,255,.35),transparent 55%);
               mix-blend-mode:screen;animation:logoSweep 6s ease-in-out infinite}
  @keyframes logoSweep{0%,20%{transform:translateX(-120%)}60%{transform:translateX(120%)}100%{transform:translateX(120%)}
  }
  .title{font-weight:900;font-size:1.1rem;letter-spacing:.02em}.sub{font-size:12px;color:var(--mut)}
  .chip{margin-left:auto;display:grid;gap:4px;border-radius:18px;padding:10px 16px;
        background:linear-gradient(150deg,rgba(10,20,42,.85),rgba(12,32,56,.55));border:1px solid rgba(75,94,150,.45);
        box-shadow:0 12px 28px rgba(10,24,50,.6);position:relative;overflow:hidden}
  .chip::before{content:"";position:absolute;inset:-60% -10%;background:linear-gradient(120deg,rgba(50,255,217,.16),rgba(124,58,237,.12),transparent 70%);
                 animation:chipGlow 12s ease-in-out infinite;opacity:.9}
  .chip>*{position:relative;z-index:1}
  .chip-score{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:16px}
  .chip-label{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:rgba(234,243,255,.68)}
  .chip-value{font-size:26px;color:#fff;text-shadow:0 0 22px rgba(79,209,197,.65)}
  .chip-best{font-size:12px;color:rgba(234,243,255,.68);display:flex;align-items:center;gap:6px}
  .chip-best::before{content:"★";color:var(--gold);font-size:11px;filter:drop-shadow(0 0 6px rgba(255,215,106,.6))}
  .chip.pop .chip-value{animation:scorePop .6s ease forwards}
  .chip.glow::after{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 50% 30%,rgba(255,215,106,.55),transparent 70%);
                    animation:bestFlash .85s ease forwards}
  @keyframes chipGlow{0%{transform:translateX(-8%)}50%{transform:translateX(12%)}100%{transform:translateX(-8%)}}
  @keyframes scorePop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes bestFlash{0%{opacity:.9}60%{opacity:.2}100%{opacity:0}}
  .board{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(900px 600px at 50% 40%,#0F1436,#050817 65%);
         border:1px solid rgba(80,100,160,.45);box-shadow:0 28px 60px rgba(4,8,28,.8),0 0 0 1px rgba(135,178,255,.08);padding:16px}
  .board::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(50,255,217,.45),rgba(124,58,237,.25),rgba(50,255,217,.45));
                 -webkit-mask:linear-gradient(#fff,#fff) content-box,linear-gradient(#fff,#fff);
                 -webkit-mask-composite:xor;mask-composite:exclude;animation:borderGlow 10s ease-in-out infinite;opacity:.75}
  @keyframes borderGlow{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(80deg)}}
  #c{display:block;width:100%;height:auto;transform:translate3d(0,0,0);border-radius:14px;box-shadow:inset 0 0 30px rgba(9,14,30,.65)}
  .danger{position:absolute;inset:16px;pointer-events:none;mix-blend-mode:screen;opacity:0}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 8px}
  .btn,.btn-ghost{min-width:108px;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
  .btn{background:linear-gradient(180deg,#2af5dd,#00C2A8);color:#00100C;border:none;box-shadow:0 16px 30px rgba(0,194,168,.25)}
  .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 18px 40px rgba(0,194,168,.35)}
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn-ghost{background:linear-gradient(160deg,rgba(16,24,58,.8),rgba(12,18,40,.55));border:1px solid rgba(74,88,150,.55);color:#E3EBFF;
             box-shadow:0 12px 24px rgba(6,12,32,.6)}
  .btn-ghost:hover{transform:translateY(-1px);filter:brightness(1.1)}
  .btn-ghost:active{transform:translateY(1px) scale(.98)}
  .hint{font-size:12px;color:var(--mut);text-align:center;letter-spacing:.04em;margin-top:4px}

  /* 左下虚拟摇杆（连续角度控制） */
  .joystick{position:fixed;left:16px;bottom:16px;z-index:30;touch-action:none}
  .joy-base{width:150px;height:150px;border-radius:50%;background:radial-gradient(110px 110px at 50% 50%,rgba(0,194,168,.18),rgba(0,0,0,.32));
            border:1px solid #2E3664;box-shadow:0 24px 45px rgba(0,0,0,.35);position:relative;backdrop-filter:blur(6px)}
  .joy-base::after{content:"";position:absolute;inset:18px;border-radius:50%;border:1px dashed rgba(111,220,210,.35);animation:spin 18s linear infinite}
  .joy-knob{width:68px;height:68px;border-radius:50%;background:linear-gradient(180deg,#21E0CB,#00C2A8);
            position:absolute;left:41px;top:41px;box-shadow:0 14px 26px rgba(0,194,168,.42);display:grid;place-items:center}
  .joy-knob::after{content:"";width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0));opacity:.35}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @media (min-width:900px){.joystick{display:none}} /* 桌面隐藏摇杆 */

  .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,6,18,.52);backdrop-filter:blur(10px);z-index:40}
  .modal.show{display:grid}
  .card{width:min(92vw,520px);background:linear-gradient(180deg,rgba(20,28,66,.96),rgba(10,15,37,.9));border:1px solid rgba(74,96,160,.5);border-radius:22px;padding:26px 24px 18px;
        box-shadow:0 28px 60px rgba(4,8,22,.75)}
  .ttl{font-size:26px;font-weight:900;margin:0 0 12px;background:linear-gradient(90deg,#B48CFF,#5CF0E1,#FFD76A);-webkit-background-clip:text;background-clip:text;color:transparent;
       letter-spacing:.05em;text-transform:uppercase}
  .actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="logo">MM</div>
    <div><div class="title">墨城贪吃蛇 · 360° Wrap</div><div class="sub">360° 连续转向｜可穿墙｜更慢更稳｜发光 UI</div></div>
    <div class="chip" id="scoreChip">
      <div class="chip-score">
        <span class="chip-label">SCORE</span>
        <span class="chip-value" id="scoreValue">0</span>
      </div>
      <div class="chip-best" id="bestValue">最佳 0</div>
    </div>
  </div>

  <div class="board" id="board">
    <canvas id="c" width="720" height="720" aria-label="贪吃蛇"></canvas>
    <canvas id="danger" class="danger"></canvas>
  </div>

  <div class="row">
    <button class="btn" id="btnStart">开始/暂停</button>
    <button class="btn-ghost" id="btnRestart">重开</button>
    <button class="btn-ghost" id="btnSlow">减速</button>
    <button class="btn-ghost" id="btnFast">加速</button>
    <button class="btn-ghost" id="btnShare">分享邀请</button>
  </div>

  <div class="hint">手机用左下“摇杆”连续转向（不需抬手）；电脑可用 ←/→ 旋转方向，↑ 加速，↓ 减速。</div>
</div>

<!-- 摇杆 -->
<div class="joystick" id="joystick">
  <div class="joy-base" id="joyBase"><div class="joy-knob" id="joyKnob"></div></div>
</div>

<!-- Game Over -->
<div class="modal" id="over">
  <div class="card">
    <div class="ttl">💥 本局结束</div>
    <div id="overText" style="color:#C8D1FF;margin-bottom:10px">得分 0 · 长度 0</div>
    <div class="actions">
      <button class="btn-ghost" onclick="location.reload()">再来一局</button>
      <button class="btn" id="btnClaim">去领奖中心</button>
    </div>
  </div>
</div>

<script>
/* ================= 配置（速度更慢、角度运动、穿墙） ================= */
const CFG = {
  DPR_MAX: 3,
  CANVAS_RATIO: 0.86,         // 画布占短边比例（更大）
  SPEED_INIT: 90,             // 头部像素/秒（更慢）
  SPEED_MIN: 60,
  SPEED_MAX: 200,
  TURN_RATE: Math.PI/1.2,     // 键盘/自动转向的最大角速度（弧度/秒）
  SEG_LEN: 16,                // 段间距（像素，视觉更圆润）
  GROW_SEG: 8,                // 每次吃到增长的段数
  HEAD_RADIUS: 9,             // 头部半径（像素；会随 DPR 放大）
  BODY_RADIUS: 7,
  EAT_RADIUS: 16,             // 吃判定半径
  SELF_HIT_SKIP: 12,          // 自撞检测跳过前 N 段，避免紧邻误判
  WALL_WARN_PIX: 40,          // 边缘警告距离（像素）
  CLAIM_URL: "#",
  SHARE_TITLE: "360° 连续转向的墨城贪吃蛇！",
  SHARE_TEXT: "可穿墙，但别咬到自己～更慢更稳更顺滑。"
};

/* ================= 画布 & DPR ================= */
const board = document.getElementById('board');
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false, desynchronized:true });
const dangerCvs = document.getElementById('danger');
const dangerCtx = dangerCvs.getContext('2d');

let DPR = Math.max(1, Math.min(CFG.DPR_MAX, window.devicePixelRatio || 1));
let view = { w: 0, h: 0 };

function resizeCanvas(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const short = Math.min(vw, vh);
  const targetCss = Math.max(420, Math.floor(short * CFG.CANVAS_RATIO));
  const px = Math.floor(targetCss * DPR);

  [cvs,dangerCvs].forEach(cv=>{
    cv.style.width = cv.style.height = targetCss + 'px';
    cv.width = cv.height = px;
  });
  view.w = view.h = px;
  ctx.imageSmoothingEnabled = true;
  draw(); drawDanger(0);
}
window.addEventListener('resize', ()=>{ DPR = Math.max(1, Math.min(CFG.DPR_MAX, window.devicePixelRatio||1)); resizeCanvas(); }, {passive:true});

/* ================= 状态 ================= */
const scoreChip = document.getElementById('scoreChip');
const scoreValue = document.getElementById('scoreValue');
const bestValue = document.getElementById('bestValue');
const overModal = document.getElementById('over');
const overText = document.getElementById('overText');
const btnClaim = document.getElementById('btnClaim');

let running=false;
let speed = CFG.SPEED_INIT;         // px/s
let angle = 0;                      // 头朝向（弧度）
let targetAngle = 0;                // 目标朝向（由摇杆/键盘控制）
let snake = [];                     // 点集（x,y）
let growLeft = 0;                   // 需要增长的剩余长度（段）
let food = {x:0,y:0};
let score = 0, best = +(localStorage.getItem('snake_best')||0);
let shake = 0;                      // 震动
let lastTs = 0;
let glowTimer = null;

/* ================= 工具 ================= */
const TAU = Math.PI*2;
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
function wrap(p){
  // 穿墙：出界即从另一边进来
  if(p.x<0) p.x += view.w; else if(p.x>view.w) p.x -= view.w;
  if(p.y<0) p.y += view.h; else if(p.y>view.h) p.y -= view.h;
}
function randFood(){
  food.x = 40 + Math.random()*(view.w-80);
  food.y = 40 + Math.random()*(view.h-80);
}

/* ================= 初始化/重置 ================= */
function reset(){
  speed = CFG.SPEED_INIT;
  const cx = view.w/2, cy = view.h/2;
  angle = targetAngle = 0;
  snake.length = 0;
  // 初始长度
  const initLen = 24;
  for(let i=0;i<initLen;i++){
    snake.push({ x: cx - i*CFG.SEG_LEN, y: cy });
  }
  score = 0; setScore(0);
  growLeft = 0; shake = 0;
  randFood();
  draw(); drawDanger(0);
}
function setScore(n){
  score = n;
  const wasBest = n>best;
  if(wasBest){
    best = n;
    localStorage.setItem('snake_best',best);
    scoreChip.classList.remove('glow');
    void scoreChip.offsetWidth;
    scoreChip.classList.add('glow');
    if(glowTimer) clearTimeout(glowTimer);
    glowTimer = setTimeout(()=>{ scoreChip.classList.remove('glow'); glowTimer=null; }, 850);
  }
  scoreValue.textContent = n;
  bestValue.textContent = `最佳 ${best}`;
  scoreChip.classList.remove('pop');
  void scoreChip.offsetWidth;
  scoreChip.classList.add('pop');
}

/* ================= 主循环（rAF，基于真实时间） ================= */
function tick(ts){
  if(!running){ lastTs = ts; draw(); return requestAnimationFrame(tick); }
  const dt = Math.min(40, (ts - lastTs)) / 1000; // s
  lastTs = ts;

  // 键盘/摇杆朝向 → 平滑旋转到 targetAngle
  const diff = normalizeAngle(targetAngle - angle);
  const maxTurn = CFG.TURN_RATE * dt;
  const turn = clamp(diff, -maxTurn, maxTurn);
  angle = normalizeAngle(angle + turn);

  // 头部前进
  const head = snake[0];
  const nx = head.x + Math.cos(angle) * speed * dt;
  const ny = head.y + Math.sin(angle) * speed * dt;
  const newHead = {x:nx, y:ny};
  wrap(newHead);

  // 按段长插值插入新头，保证段间距恒定
  const prev = snake[0];
  const dx = newHead.x - prev.x, dy = newHead.y - prev.y;
  const d = Math.hypot(dx,dy);
  if(d > CFG.SEG_LEN*0.6){
    snake.unshift(newHead);
  }else{
    // 微步：保持平滑
    prev.x = newHead.x; prev.y = newHead.y;
  }

  // 根据段长，修剪尾巴或增长
  let acc = 0;
  for(let i=0;i<snake.length-1;i++){
    const a=snake[i], b=snake[i+1];
    const dd = Math.hypot(a.x-b.x, a.y-b.y);
    if(dd>CFG.SEG_LEN){
      // 把 b 拉近 a
      const t = (dd - CFG.SEG_LEN) / dd;
      b.x += (a.x - b.x) * t;
      b.y += (a.y - b.y) * t;
    }
    acc += dd;
  }
  // 控制总段数：吃到时增加段
  if(growLeft>0){
    const tail = snake[snake.length-1];
    const pre = snake[snake.length-2];
    const vx = tail.x - pre.x, vy = tail.y - pre.y;
    const len = Math.hypot(vx,vy) || 1;
    snake.push({ x: tail.x + (vx/len)*CFG.SEG_LEN, y: tail.y + (vy/len)*CFG.SEG_LEN });
    growLeft--;
  }else{
    // 正常修剪
    while(snake.length>2){
      const a=snake[snake.length-2], b=snake[snake.length-1];
      const dd = Math.hypot(a.x-b.x, a.y-b.y);
      if(dd < CFG.SEG_LEN*0.9) break;
      snake.pop();
    }
  }

  // 吃食物（距离判定）
  const eatR2 = (CFG.EAT_RADIUS * DPR)**2;
  if(dist2(snake[0], food) < eatR2){
    setScore(score+10);
    growLeft += CFG.GROW_SEG;
    randFood();
    shake = 3; // 轻微震动
  }else{
    shake = Math.max(0, shake - dt*8);
  }

  // 自撞（跳过前 SELF_HIT_SKIP 段）
  const headR2 = (CFG.HEAD_RADIUS*1.15*DPR)**2;
  for(let i=CFG.SELF_HIT_SKIP;i<snake.length;i++){
    if(dist2(snake[0], snake[i]) < headR2){ return gameOver(); }
  }

  // 危险提示（临近边缘）
  drawDanger(edgeDanger());

  draw();
  requestAnimationFrame(tick);
}
function normalizeAngle(a){
  // 归一化到 -PI..PI
  while(a>Math.PI) a-=TAU;
  while(a<-Math.PI) a+=TAU;
  return a;
}

/* ================= 绘制 ================= */
function draw(){
  const W=view.w, H=view.h;
  // 背景 & 震动
  const ox = shake? (Math.random()*2-1)*shake : 0;
  const oy = shake? (Math.random()*2-1)*shake : 0;
  cvs.style.transform = `translate3d(${ox}px,${oy}px,0)`;

  // 背景网格
  ctx.clearRect(0,0,W,H);
  const bgGrad = ctx.createRadialGradient(W/2,H*0.42, W*0.08, W/2,H*0.42, W*0.75);
  bgGrad.addColorStop(0,'#101A3A');
  bgGrad.addColorStop(0.45,'#090F24');
  bgGrad.addColorStop(1,'#050817');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  const sweep = ctx.createLinearGradient(0,0,W,H);
  sweep.addColorStop(0,'rgba(50,255,217,.08)');
  sweep.addColorStop(0.5,'rgba(124,58,237,.05)');
  sweep.addColorStop(1,'rgba(50,255,217,.1)');
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = sweep;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle='rgba(44,51,95,.18)';
  ctx.lineWidth=Math.max(1,0.8*DPR);
  ctx.shadowColor='rgba(31,45,94,.22)';
  ctx.shadowBlur=12;
  ctx.beginPath();
  const grid = 40*DPR;
  for(let x=0;x<=W;x+=grid){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=0;y<=H;y+=grid){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  ctx.restore();

  // 食物（脉冲光）
  const t = Date.now()*0.004;
  const fr = 10*DPR + Math.sin(t)*2;
  const g = ctx.createRadialGradient(food.x,food.y,1,food.x,food.y, fr*3);
  g.addColorStop(0,'rgba(255,215,106,.95)');
  g.addColorStop(1,'rgba(255,215,106,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(food.x,food.y, fr*3, 0, TAU); ctx.fill();
  ctx.fillStyle='#FFD76A'; ctx.beginPath(); ctx.arc(food.x,food.y, fr, 0, TAU); ctx.fill();

  if(!snake.length) return;

  // 蛇体（渐变发光描边）
  const head=snake[0], tail=snake[snake.length-1];
  const lg = ctx.createLinearGradient(head.x,head.y, tail.x,tail.y);
  lg.addColorStop(0,'#32ffd9'); lg.addColorStop(1,'#9e7bff');
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=lg; ctx.lineWidth=Math.max(2, CFG.BODY_RADIUS*2*DPR);
  ctx.shadowColor='rgba(50,255,217,.5)'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.moveTo(snake[0].x, snake[0].y);
  for(let i=1;i<snake.length;i++) ctx.lineTo(snake[i].x, snake[i].y);
  ctx.stroke();
  ctx.restore();

  // 头部圆、眼睛、吐信子（沿 angle）
  const HR = CFG.HEAD_RADIUS*DPR, BR = CFG.BODY_RADIUS*DPR;
  // 头
  ctx.fillStyle='#00C2A8'; ctx.beginPath(); ctx.arc(head.x, head.y, HR*0.9, 0, TAU); ctx.fill();

  // 吐信子（呼吸式伸缩）
  const active = ((Date.now()/320)%2)>0.15;
  if(active){
    const len = HR*(0.8 + 0.7*Math.sin(Date.now()/160));
    const tx = head.x + Math.cos(angle)*len;
    const ty = head.y + Math.sin(angle)*len;
    ctx.strokeStyle='#FF5A7A'; ctx.lineWidth=Math.max(2, HR*0.18);
    ctx.beginPath(); ctx.moveTo(head.x,head.y); ctx.lineTo(tx,ty); ctx.stroke();
    // 分叉
    const side = 7*DPR;
    ctx.beginPath();
    ctx.moveTo(tx,ty); ctx.lineTo(tx - Math.cos(angle - 0.8)*side, ty - Math.sin(angle - 0.8)*side);
    ctx.moveTo(tx,ty); ctx.lineTo(tx - Math.cos(angle + 0.8)*side, ty - Math.sin(angle + 0.8)*side);
    ctx.stroke();
  }

  // 眼睛
  const off = HR*0.55, side = HR*0.4;
  const ex = head.x + Math.cos(angle)*off, ey = head.y + Math.sin(angle)*off;
  const nx = -Math.sin(angle), ny = Math.cos(angle); // 法向
  ctx.fillStyle='#0B1020';
  ctx.beginPath();
  ctx.arc(ex + nx*side, ey + ny*side, Math.max(2, HR*0.18), 0, TAU);
  ctx.arc(ex - nx*side, ey - ny*side, Math.max(2, HR*0.18), 0, TAU);
  ctx.fill();
}

/* ================= 危险提示（靠近边缘时红晕） ================= */
function drawDanger(intensity){
  const W=view.w, H=view.h;
  dangerCtx.clearRect(0,0,W,H);
  if(intensity<=0){ dangerCvs.style.opacity=0; return; }
  const grad = dangerCtx.createRadialGradient(W/2,H/2, W*0.2, W/2,H/2, W*0.65);
  grad.addColorStop(0,`rgba(255,60,60,0)`);
  grad.addColorStop(1,`rgba(255,60,60,${0.25*intensity})`);
  dangerCtx.fillStyle=grad; dangerCtx.fillRect(0,0,W,H);
  dangerCvs.style.opacity = 1;
}
function edgeDanger(){
  const h = snake[0]; if(!h) return 0;
  const d = Math.min(h.x, h.y, view.w-h.x, view.h-h.y);
  if(d >= CFG.WALL_WARN_PIX) return 0;
  const base = 1 - d/CFG.WALL_WARN_PIX;
  return Math.min(1, base * (0.75 + 0.25*Math.sin(Date.now()*0.008)));
}

/* ================= 操作：开始/暂停/速度/分享 ================= */
function playPause(){ running=!running; }
document.getElementById('btnStart').onclick = playPause;
document.getElementById('btnRestart').onclick = ()=>{ running=false; reset(); draw(); };
document.getElementById('btnFast').onclick = ()=> speed = Math.min(CFG.SPEED_MAX, speed+15);
document.getElementById('btnSlow').onclick = ()=> speed = Math.max(CFG.SPEED_MIN, speed-15);
document.getElementById('btnShare').onclick = async ()=>{
  const base = location.origin + location.pathname.replace(/\/$/,'');
  const link = `${base}?ref=${encodeURIComponent(getInviterId())}`;
  if(navigator.share){ try{ await navigator.share({title:CFG.SHARE_TITLE,text:CFG.SHARE_TEXT,url:link}); }catch(e){} }
  else{ await navigator.clipboard.writeText(link).catch(()=>{}); alert('邀请链接已复制：\n'+link); }
};

/* ================= 键盘控制（左右转向、上下调速） ================= */
document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k===' '||k==='enter') return playPause();
  if(k==='arrowleft'||k==='a') targetAngle = normalizeAngle(targetAngle - 0.22);   // 微调角度
  if(k==='arrowright'||k==='d') targetAngle = normalizeAngle(targetAngle + 0.22);
  if(k==='arrowup'||k==='w') speed = Math.min(CFG.SPEED_MAX, speed+10);
  if(k==='arrowdown'||k==='s') speed = Math.max(CFG.SPEED_MIN, speed-10);
});

/* ================= 虚拟摇杆（连续角度） ================= */
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyActive=false, joyCenter={x:0,y:0}, joyId=null;

function joySet(dx,dy){
  const r=56; const len=Math.hypot(dx,dy);
  const ux = len>r ? dx/len*r : dx;
  const uy = len>r ? dy/len*r : dy;
  joyKnob.style.transform = `translate(${ux}px,${uy}px)`;
  // 死区
  if(len < 10){ return; }
  targetAngle = Math.atan2(uy, ux); // 连续角度
}
function joyReset(){ joyKnob.style.transform='translate(0,0)'; joyActive=false; joyId=null; }

joyBase.addEventListener('pointerdown', e=>{
  joyActive=true; joyId=e.pointerId;
  const rect=joyBase.getBoundingClientRect();
  joyCenter={x:rect.left+rect.width/2,y:rect.top+rect.height/2};
  joySet(e.clientX - joyCenter.x, e.clientY - joyCenter.y);
  joyBase.setPointerCapture(joyId);
});
joyBase.addEventListener('pointermove', e=>{
  if(!joyActive || e.pointerId!==joyId) return;
  joySet(e.clientX - joyCenter.x, e.clientY - joyCenter.y);
});
['pointerup','pointercancel'].forEach(ev=> joyBase.addEventListener(ev, e=>{ if(e.pointerId===joyId) joyReset(); }));

/* ================= 结束 & 邀请ID ================= */
function gameOver(){
  running=false;
  overText.textContent = `得分 ${score} · 历史最佳 ${best} · 长度 ${snake.length}`;
  overModal.classList.add('show');
}
btnClaim.onclick = ()=> location.href = CFG.CLAIM_URL || '#';
function getInviterId(){
  let id = localStorage.getItem('inviter_id');
  if(!id){ id='U'+Math.random().toString(36).slice(2,8); localStorage.setItem('inviter_id', id); }
  return id;
}

/* ================= 启动 ================= */
resizeCanvas(); reset(); requestAnimationFrame(tick);
